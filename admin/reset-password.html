<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — Qor AI</title>
  <link rel="icon" href="favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #00e5ff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      color: #f5f5f5;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 6px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    input[type=password] {
      width: 100%;
      background: #111;
      border: 1.5px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px 16px;
      color: #f5f5f5;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type=password]:focus { border-color: #00e5ff; }
    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    .btn {
      width: 100%;
      background: #00e5ff;
      color: #000;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .msg {
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
      display: none;
    }
    .msg.error { background: #ef444420; border: 1px solid #ef444440; color: #fca5a5; }
    .msg.success { background: #22c55e20; border: 1px solid #22c55e40; color: #86efac; }
    .back {
      display: block;
      text-align: center;
      color: #555;
      font-size: 13px;
      margin-top: 20px;
      text-decoration: none;
    }
    .back:hover { color: #00e5ff; }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Qor AI</div>
    <div class="title" id="pageTitle">Reset Password</div>
    <p class="subtitle" id="pageSubtitle">Enter your new password below.</p>

    <div class="msg" id="msgBox"></div>

    <form id="resetForm">
      <div class="field">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Minimum 8 characters" autocomplete="new-password">
        <p class="hint">At least 8 characters</p>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat new password" autocomplete="new-password">
      </div>
      <button type="submit" class="btn" id="submitBtn">Reset Password</button>
    </form>

    <a class="back" href="https://qorai.net">← Back to Qor AI</a>
  </div>

  <script>
    const PB_URL = 'https://yv5z6sfeiogrv3jn4djss832.46.225.95.201.sslip.io';

    function getToken() {
      return new URLSearchParams(window.location.search).get('token') || '';
    }

    function showMsg(text, type) {
      const el = document.getElementById('msgBox');
      el.textContent = text;
      el.className = 'msg ' + type;
      el.style.display = 'block';
    }

    function hideMsg() {
      document.getElementById('msgBox').style.display = 'none';
    }

    // On load: validate token presence
    window.addEventListener('DOMContentLoaded', () => {
      const token = getToken();
      if (!token) {
        document.getElementById('pageTitle').textContent = 'Invalid Link';
        document.getElementById('pageSubtitle').textContent = 'This password reset link is invalid or has expired.';
        document.getElementById('resetForm').style.display = 'none';
        showMsg('Please request a new password reset from the Qor AI app.', 'error');
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg();

      const token = getToken();
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        showMsg('Password must be at least 8 characters.', 'error');
        return;
      }
      if (password !== confirm) {
        showMsg('Passwords do not match.', 'error');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Resetting...';

      try {
        const res = await fetch(`${PB_URL}/api/collections/users/confirm-password-reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password, passwordConfirm: confirm }),
        });

        if (res.ok) {
          document.getElementById('resetForm').style.display = 'none';
          document.getElementById('pageTitle').textContent = 'Password Updated!';
          document.getElementById('pageSubtitle').textContent = 'Your password has been reset successfully. You can now sign in to Qor AI with your new password.';
          showMsg('✓ Password reset successfully. Open the Qor AI app to sign in.', 'success');
        } else {
          const data = await res.json().catch(() => ({}));
          const msg = data?.message || 'This link may have expired. Please request a new password reset.';
          showMsg(msg, 'error');
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        }
      } catch (err) {
        showMsg('Network error. Please check your connection and try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
