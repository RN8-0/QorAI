server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static asset caching — short TTL with revalidation so admin deploys
    # take effect on next page load. The cache-busted `?v=Date.now()` query
    # string set in index.html guarantees a fresh fetch after each deploy,
    # so we only need a short browser-side cache here. `immutable` was
    # removed because it told browsers/proxies to never re-validate,
    # which masked deployed JS fixes for the scraper.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Never cache the entry document — its inline loader stamps every asset
    # with a fresh `?v=` so we want the latest HTML on every visit.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
