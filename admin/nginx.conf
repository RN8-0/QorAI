# ═══════════════════════════════════════════════════════════════════════
#  DİKKAT — BU DOSYA COOLIFY TARAFINDAN OKUNMUYOR (2026-08-03'te ölçüldü)
#
#  qorai-admin uygulamasının Coolify build pack'i `static` (dockerfile DEĞİL).
#  Static pack kendi nginx:alpine imajını kurar; repodaki Dockerfile ve bu
#  dosya kullanılmaz. Canlı ayar Coolify veritabanında:
#      applications.custom_nginx_configuration  (base64)
#  Bu dosya o ayarın KAYNAK KOPYASIDIR — değiştirirsen aşağıdaki yöntemle
#  canlıya da taşı, yoksa hiçbir etkisi olmaz.
#
#  NASIL GÜNCELLENİR (API BOZUK, ELLE YAPILIR):
#   1. Sunucuda doğrula (bozuk config konteyneri restart döngüsüne sokar):
#        scp -i migration/qorai_hetzner admin/nginx.conf root@<IP>:/tmp/nx.conf
#        ssh ... 'docker run --rm -v /tmp/nx.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine nginx -t'
#   2. Coolify DB'ye yaz (base64):
#        ssh ... "B64=\$(base64 -w0 /tmp/nx.conf); docker exec coolify-db psql -U coolify -d coolify \
#          -c \"UPDATE applications SET custom_nginx_configuration='\$B64' WHERE uuid='z1221ae58okr865xdquykps8';\""
#   3. node scripts/deploy_coolify_static.js admin
#
#  NEDEN API DEĞİL: Coolify API'si `custom_nginx_configuration` alanına base64
#  ZORUNLU kılıyor ama gelen değeri BİR KEZ DAHA base64'leyip saklıyor; build
#  ise bir kez çözüp dosyaya yazıyor. Sonuç: nginx.conf'a düz base64 metni
#  düşüyor ve nginx "unexpected end of file" ile çöküyor (yaşandı, panel
#  ~20 dk kapalı kaldı). Düz metin göndermeyi de validator reddediyor.
# ═══════════════════════════════════════════════════════════════════════
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # Giriş dokümanı ASLA cache'lenmez. İçindeki yükleyici her varlığa taze
    # ?v= damgası basıyor; index.html bayatlarsa TÜM JS de bayatlıyor.
    # "Deploy ettim ama sayfada hiçbir şey değişmedi" şikayetinin gerçek
    # sebebi buydu: static pack HİÇ Cache-Control göndermiyordu, tarayıcı da
    # sezgisel cache uyguluyordu.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html $uri/ /index.html =404;
    }

    # Varlıklar: 1 saat + revalidate. ?v= damgası tazeliği zaten garanti eder.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
