name: Deploy website

on:
  push:
    branches:
      - master
    paths:
      - website/**
      - web/**
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify website deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBSITE_UUID: ${{ secrets.COOLIFY_WEBSITE_UUID }}
        run: |
          set -euo pipefail
          : "${COOLIFY_URL:?COOLIFY_URL secret is missing}"
          : "${COOLIFY_TOKEN:?COOLIFY_TOKEN secret is missing}"
          : "${COOLIFY_WEBSITE_UUID:?COOLIFY_WEBSITE_UUID secret is missing}"

          base="${COOLIFY_URL%/}"
          curl --fail --show-error --silent \
            --request GET \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Accept: application/json" \
            "${base}/api/v1/deploy?uuid=${COOLIFY_WEBSITE_UUID}&force=false"
