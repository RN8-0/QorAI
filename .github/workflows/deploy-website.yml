name: Deploy live

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploys
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBSITE_UUID: ${{ secrets.COOLIFY_WEBSITE_UUID }}
          COOLIFY_ADMIN_UUID: ${{ secrets.COOLIFY_ADMIN_UUID }}
          COOLIFY_POCKETBASE_UUID: ${{ secrets.COOLIFY_POCKETBASE_UUID }}
        run: |
          set -euo pipefail
          : "${COOLIFY_URL:?COOLIFY_URL secret is missing}"
          : "${COOLIFY_TOKEN:?COOLIFY_TOKEN secret is missing}"
          : "${COOLIFY_WEBSITE_UUID:?COOLIFY_WEBSITE_UUID secret is missing}"
          : "${COOLIFY_ADMIN_UUID:?COOLIFY_ADMIN_UUID secret is missing}"
          : "${COOLIFY_POCKETBASE_UUID:?COOLIFY_POCKETBASE_UUID secret is missing}"

          base="${COOLIFY_URL%/}"
          deploy() {
            local name="$1"
            local uuid="$2"
            echo "Deploying ${name} (${uuid})"
            curl --fail --show-error --silent \
              --request GET \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              --header "Accept: application/json" \
              "${base}/api/v1/deploy?uuid=${uuid}&force=true"
            echo
          }

          deploy "qorai-website" "${COOLIFY_WEBSITE_UUID}"
          deploy "qorai-admin" "${COOLIFY_ADMIN_UUID}"
          deploy "pocketbase-qorai" "${COOLIFY_POCKETBASE_UUID}"
