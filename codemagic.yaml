workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      integrations:
        app_store_connect: qorai_asc_key   # Codemagic Teams → Integrations'ta tanımlı
      vars:
        BUNDLE_ID: "com.qorai.app"
        XCODE_SCHEME: "Runner"

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Set up keychain
        script: keychain initialize

      - name: Fetch signing files from Apple
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply code signing settings
        script: xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Run Flutter analyze (lint)
        script: flutter analyze --no-fatal-infos || true

      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=$(echo $CM_TAG | sed 's/^v//') \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration          # qorai_asc_key integration'ını kullan
        submit_to_testflight: true
        submit_to_app_store: false  # TestFlight onayından sonra true yap
        beta_groups:
          - "Internal Testers"

      email:
        recipients:
          - $CM_SUBMITTER_EMAIL
        notify:
          success: true
          failure: true
