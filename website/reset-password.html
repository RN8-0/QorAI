<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırla — Qor AI</title>
  <meta name="description" content="Qor AI hesabınızın şifresini güvenli şekilde sıfırlayın.">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/style.css?v=20260428b">
  <script>try{var t=localStorage.getItem('qorai-theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <style>
    .reset-wrap {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .reset-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 20px 60px var(--shadow);
    }
    .reset-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }
    .reset-logo img { width: 32px; height: 32px; border-radius: 8px; }
    .reset-logo span { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: var(--text); }
    .reset-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .reset-subtitle {
      font-size: 14px;
      color: var(--text2);
      margin-bottom: 26px;
      line-height: 1.55;
    }
    .reset-field { margin-bottom: 16px; }
    .reset-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 8px;
    }
    .reset-field input {
      width: 100%;
      background: var(--bg3);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color .18s, background .18s;
    }
    .reset-field input:focus {
      border-color: var(--accent);
      background: var(--bg2);
    }
    .reset-hint {
      font-size: 12px;
      color: var(--text3);
      margin-top: 6px;
    }
    .reset-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 15px 16px;
      cursor: pointer;
      transition: opacity .18s, transform .18s;
      margin-top: 8px;
    }
    .reset-btn:hover:not(:disabled) { opacity: .9; }
    .reset-btn:active:not(:disabled) { transform: translateY(1px); }
    .reset-btn:disabled { opacity: .45; cursor: not-allowed; }
    .reset-msg {
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
      display: none;
    }
    .reset-msg.error {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5;
      display: block;
    }
    .reset-msg.success {
      background: rgba(16,185,129,.12);
      border: 1px solid rgba(16,185,129,.3);
      color: #6ee7b7;
      display: block;
    }
    .reset-back {
      display: block;
      text-align: center;
      color: var(--text3);
      font-size: 13px;
      margin-top: 22px;
      text-decoration: none;
    }
    .reset-back:hover { color: var(--accent); }
    .reset-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header class="site-header">
  <a href="/" class="logo-link">
    <img src="/assets/logo.png" alt="Qor AI" class="logo-img">
    <span class="logo-text">Qor AI</span>
  </a>
  <div class="header-actions">
    <button class="icon-btn theme-btn" id="theme-toggle" aria-label="Tema değiştir" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<main class="reset-wrap">
  <div class="reset-card">
    <div class="reset-logo">
      <img src="/assets/logo.png" alt="Qor AI">
      <span>Qor AI</span>
    </div>

    <h1 class="reset-title" id="pageTitle">Şifre Sıfırla</h1>
    <p class="reset-subtitle" id="pageSubtitle">Yeni şifrenizi aşağıya girin. Şifre değiştikten sonra Qor AI uygulamasından giriş yapabilirsiniz.</p>

    <div class="reset-msg" id="msgBox"></div>

    <form id="resetForm" novalidate>
      <div class="reset-field">
        <label for="newPassword">Yeni Şifre</label>
        <input type="password" id="newPassword" placeholder="En az 8 karakter" autocomplete="new-password" required minlength="8">
        <div class="reset-hint">En az 8 karakter olmalı.</div>
      </div>
      <div class="reset-field">
        <label for="confirmPassword">Yeni Şifre (Tekrar)</label>
        <input type="password" id="confirmPassword" placeholder="Şifreyi tekrar girin" autocomplete="new-password" required minlength="8">
      </div>
      <button type="submit" class="reset-btn" id="submitBtn">Şifreyi Güncelle</button>
    </form>

    <a class="reset-back" href="/">← Qor AI ana sayfaya dön</a>
  </div>
</main>

<script>
  const PB_URL = 'https://yv5z6sfeiogrv3jn4djss832.46.225.95.201.sslip.io';

  function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('qorai-theme', next); } catch (e) {}
  }

  function getQuery(name) {
    var match = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : '';
  }

  function showMsg(text, kind) {
    var el = document.getElementById('msgBox');
    el.textContent = text;
    el.className = 'reset-msg ' + (kind || 'error');
  }

  function clearMsg() {
    var el = document.getElementById('msgBox');
    el.textContent = '';
    el.className = 'reset-msg';
    el.style.display = 'none';
  }

  var TOKEN = getQuery('token');

  document.addEventListener('DOMContentLoaded', function () {
    if (!TOKEN) {
      document.getElementById('pageTitle').textContent = 'Geçersiz Bağlantı';
      document.getElementById('pageSubtitle').textContent = 'Bu şifre sıfırlama bağlantısı geçersiz veya süresi dolmuş.';
      document.getElementById('resetForm').style.display = 'none';
      showMsg('Lütfen Qor AI uygulamasından yeni bir şifre sıfırlama isteği gönderin.', 'error');
      return;
    }

    document.getElementById('resetForm').addEventListener('submit', function (e) {
      e.preventDefault();
      clearMsg();
      var pw = document.getElementById('newPassword').value;
      var cp = document.getElementById('confirmPassword').value;
      if (pw.length < 8) { showMsg('Şifre en az 8 karakter olmalı.', 'error'); return; }
      if (pw !== cp) { showMsg('Şifreler eşleşmiyor.', 'error'); return; }

      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="reset-spinner"></span>Güncelleniyor...';

      fetch(PB_URL + '/api/collections/users/confirm-password-reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: TOKEN, password: pw, passwordConfirm: cp }),
      })
        .then(function (res) {
          return res.json().then(function (body) { return { ok: res.ok, body: body }; })
            .catch(function () { return { ok: res.ok, body: {} }; });
        })
        .then(function (result) {
          if (result.ok) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('pageTitle').textContent = 'Şifre Güncellendi';
            document.getElementById('pageSubtitle').textContent = 'Yeni şifrenizle Qor AI uygulamasından giriş yapabilirsiniz.';
            showMsg('Şifreniz başarıyla güncellendi. Uygulamadan giriş yapabilirsiniz.', 'success');
          } else {
            var msg = (result.body && (result.body.message || result.body.error)) ||
              'Bağlantı geçersiz veya süresi dolmuş. Uygulamadan yeni bir sıfırlama isteyin.';
            showMsg(msg, 'error');
            btn.disabled = false;
            btn.textContent = 'Şifreyi Güncelle';
          }
        })
        .catch(function () {
          showMsg('Ağ hatası. Lütfen tekrar deneyin.', 'error');
          btn.disabled = false;
          btn.textContent = 'Şifreyi Güncelle';
        });
    });
  });
</script>

</body>
</html>
