    <main class="main-content">
      <header class="topbar">
        <button class="mobile-hamburger" id="hamburger"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="sidebar-logo" style="border:none;padding:0;margin:0;">
          <a href="/" style="display:flex;align-items:center;gap:8px;"><div class="logo-icon">C</div><h1 style="font-size:18px;">PC Builder</h1></a>
        </div>
        <div id="budget-display" style="margin-left:auto;display:flex;gap:16px;align-items:center;">
          <div style="text-align:center;">
            <div id="budget-total" style="font-size:16px;font-weight:800;color:var(--primary);">$0</div>
            <div style="font-size:10px;color:var(--text-muted);">Total</div>
          </div>
          <div style="text-align:center;">
            <div id="budget-watts" style="font-size:16px;font-weight:800;color:var(--warning);">0W</div>
            <div style="font-size:10px;color:var(--text-muted);">Power</div>
          </div>

      <div class="content-area">
        <!-- Step Indicator -->
        <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:16px;scrollbar-width:none;" id="step-indicator">
        </div>

        <!-- Step Content -->
        <div id="step-content">
        </div>

        <!-- Bottom Nav -->
        <div style="display:flex;gap:12px;margin-top:24px;padding:16px 0;border-top:1px solid var(--border-light);">
          <button class="btn btn-outline" id="prev-btn" onclick="prevStep()" style="flex:1;justify-content:center;" disabled>← Back</button>
          <button class="btn btn-primary" id="next-btn" onclick="nextStep()" style="flex:2;justify-content:center;">Skip → Motherboard</button>
        </div>
      </div>

<script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.3/dist/pocketbase.umd.js"></script>
<script src="/js/pb_client.js"></script>
<script src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.3/dist/pocketbase.umd.js"></script>
<script src="/js/pb_client.js"></script>
<script src="/js/auth.js"></script>
  <script>
    const STEPS = [
      { id: 'cpu', label: 'CPU', icon: '⚡', color: '#3B82F6', cat: 'cpus' },
      { id: 'motherboard', label: 'Motherboard', icon: '🔧', color: '#8B5CF6', cat: 'motherboards' },
      { id: 'ram', label: 'RAM', icon: '💾', color: '#10B981', cat: 'ram' },
      { id: 'gpu', label: 'GPU', icon: '🎮', color: '#EF4444', cat: 'gpus' },
      { id: 'storage', label: 'Storage', icon: '💽', color: '#F59E0B', cat: 'ssd' },
      { id: 'psu', label: 'PSU', icon: '🔌', color: '#06B6D4', cat: 'psu' },
      { id: 'case', label: 'Case', icon: '🖥️', color: '#6366F1', cat: 'cases' },
      { id: 'cooler', label: 'Cooler', icon: '❄️', color: '#14B8A6', cat: 'coolers' },
    ];

    let currentStep = 0;
    let selections = {};
    let stepProducts = {};

    document.addEventListener('DOMContentLoaded', async () => {
      await loadStepProducts();
      renderStepIndicator();
      renderStep();
    });

    async function loadStepProducts() {
      for (const step of STEPS) {
        try {
          const items = await pbGetByCategory(step.cat, 50);
          stepProducts[step.cat] = items
            .sort((a, b) => (b.techScore || 0) - (a.techScore || 0));
        } catch(e) {
          stepProducts[step.cat] = [];
        }
      }
      renderStep();
    }

    function renderStepIndicator() {
      const el = document.getElementById('step-indicator');
      el.innerHTML = STEPS.map((s, i) => {
        const isActive = i === currentStep;
        const isDone = selections[s.id];
        return `<div onclick="goToStep(${i})" style="
          display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;cursor:pointer;
          flex-shrink:0;font-size:12px;font-weight:${isActive?700:500};white-space:nowrap;
          background:${isActive?s.color+'18':isDone?'#10B98118':'white'};
          border:1px solid ${isActive?s.color+'40':isDone?'#10B98130':'var(--border)'};
          color:${isActive?s.color:isDone?'#059669':'var(--text-secondary)'};
        ">${isDone&&!isActive?'✓':s.icon} ${s.label}</div>`;
      }).join('');
    }

    function renderStep() {
      const step = STEPS[currentStep];
      const prods = stepProducts[step.cat] || [];
      const selected = selections[step.id];
      const content = document.getElementById('step-content');

      let html = `
        <div style="text-align:center;margin-bottom:24px;">
          <div style="display:inline-flex;width:56px;height:56px;border-radius:16px;background:${step.color}15;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px;">${step.icon}</div>
          <h2 style="font-size:22px;font-weight:900;">Select ${step.label}</h2>
          <p style="font-size:13px;color:var(--text-secondary);">Step ${currentStep+1} of ${STEPS.length}</p>
        </div>`;

      if (selected) {
        html += `
          <div style="padding:12px 16px;background:#10B98112;border:1px solid #10B98130;border-radius:12px;margin-bottom:16px;display:flex;align-items:center;gap:10px;">
            <span style="color:#059669;font-size:18px;">✓</span>
            <span style="font-weight:700;color:#059669;font-size:13px;">${selected.name}</span>
            <button onclick="deselect('${step.id}')" style="margin-left:auto;font-size:11px;color:var(--text-muted);background:none;">✕ Remove</button>
          </div>`;
      }

      if (prods.length === 0) {
        html += `
          <div style="text-align:center;padding:40px 20px;">
            <div style="display:inline-flex;width:64px;height:64px;border-radius:20px;background:${step.color}10;align-items:center;justify-content:center;font-size:32px;margin-bottom:16px;">${step.icon}</div>
            <h3 style="font-size:18px;font-weight:800;margin-bottom:8px;">${step.label} Coming Soon</h3>
            <p style="font-size:13px;color:var(--text-secondary);max-width:300px;margin:0 auto;">We're adding ${step.label.toLowerCase()} products. Skip this step or check back soon!</p>
          </div>`;
      } else {
        html += `
          <div style="margin-bottom:12px;">
            <input type="text" placeholder="Search ${step.label}..." onkeyup="filterProducts(this.value)" 
                   style="width:100%;padding:12px 16px;border-radius:14px;">
          </div>
          <div id="products-list" style="display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;">`;
        prods.forEach(p => {
          const price = p.prices?.USD || p.prices?.TRY || 0;
          const score = (p.techScore||0).toFixed(0);
          const isSelected = selected?.id === p.id;
          html += `
            <div onclick="selectProduct('${step.id}','${p.id}')" class="product-row" style="
              display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:pointer;
              background:${isSelected?step.color+'08':'white'};
              border:${isSelected?'2px':'1px'} solid ${isSelected?step.color+'40':'var(--border)'};
              transition:all .2s;
            ">
              <div style="width:48px;height:48px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;">
                ${p.imageUrl?`<img src="${p.imageUrl}" style="max-width:40px;max-height:40px;object-fit:contain;" onerror="this.parentElement.innerHTML='${step.icon}'">`:`<span style="font-size:20px;">${step.icon}</span>`}
              </div>
              <div style="flex:1;min-width:0;">
                <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.name}</div>
                <div style="font-size:11px;color:var(--text-muted);">${p.brand||''}</div>
              </div>
              <div style="text-align:right;flex-shrink:0;">
                ${price>0?`<div style="font-size:14px;font-weight:800;">$${price.toFixed(0)}</div>`:''}
                <div style="font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:${score>=70?'#10B98118':'#F59E0B18'};color:${score>=70?'#059669':'#D97706'};">⚡${score}</div>
              </div>
              ${isSelected?'<span style="color:'+step.color+';font-size:18px;">✓</span>':''}
            </div>`;
        });
        html += '</div>';
      }
      content.innerHTML = html;
      updateNav();
    }

    function selectProduct(stepId, productId) {
      const step = STEPS.find(s => s.id === stepId);
      const prods = stepProducts[step.cat] || [];
      const product = prods.find(p => p.id === productId);
      if (product) {
        selections[stepId] = product;
        renderStepIndicator();
        renderStep();
        updateBudget();
      }
    }

    function deselect(stepId) {
      delete selections[stepId];
      renderStepIndicator();
      renderStep();
      updateBudget();
    }

    function filterProducts(query) {
      const rows = document.querySelectorAll('.product-row');
      const q = query.toLowerCase();
      rows.forEach(row => {
        const name = row.textContent.toLowerCase();
        row.style.display = name.includes(q) ? 'flex' : 'none';
      });
    }

    function goToStep(i) {
      if (i >= 0 && i < STEPS.length) { currentStep = i; renderStepIndicator(); renderStep(); }
    }
    function nextStep() { if (currentStep < STEPS.length - 1) goToStep(currentStep + 1); }
    function prevStep() { if (currentStep > 0) goToStep(currentStep - 1); }

    function updateNav() {
      const prev = document.getElementById('prev-btn');
      const next = document.getElementById('next-btn');
      prev.disabled = currentStep === 0;
      const hasSelection = selections[STEPS[currentStep].id];
      const nextLabel = currentStep < STEPS.length - 1 ? STEPS[currentStep + 1].label : 'Done';
      next.textContent = hasSelection ? `Next → ${nextLabel}` : `Skip → ${nextLabel}`;
      if (currentStep === STEPS.length - 1) {
        next.textContent = '✓ View Summary';
        next.onclick = showSummary;
      } else {
        next.onclick = nextStep;
      }
    }

    function updateBudget() {
      let total = 0;
      let watts = 0;
      const defaultWatts = { cpu:95, gpu:200, ram:10, motherboard:30, storage:8, psu:0, case:0, cooler:5 };
      for (const [key, p] of Object.entries(selections)) {
        total += p.prices?.USD || p.prices?.TRY || 0;
        watts += defaultWatts[key] || 20;
      }
      const totalEl = document.getElementById('budget-total');
      const wattsEl = document.getElementById('budget-watts');
      if (totalEl) totalEl.textContent = `$${total.toFixed(0)}`;
      if (wattsEl) wattsEl.textContent = `${watts}W`;
    }

    function showSummary() {
      const content = document.getElementById('step-content');
      let total = 0;
      let parts = '';
      STEPS.forEach(s => {
        const p = selections[s.id];
        const price = p ? (p.prices?.USD || p.prices?.TRY || 0) : 0;
        total += price;
        parts += `
          <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:white;border:1px solid var(--border);border-radius:14px;">
            <div style="width:36px;height:36px;border-radius:10px;background:${s.color}15;display:flex;align-items:center;justify-content:center;font-size:16px;">${s.icon}</div>
            <div style="flex:1;">
              <div style="font-size:11px;font-weight:600;color:${s.color};">${s.label}</div>
              <div style="font-size:13px;font-weight:700;">${p?p.name:'Not selected'}</div>
            </div>
            ${p?`<div style="font-weight:800;">$${price.toFixed(0)}</div>`:`<span style="font-size:12px;color:var(--text-muted);">Skipped</span>`}
          </div>`;
      });
      content.innerHTML = `
        <div class="glass" style="padding:24px;text-align:center;margin-bottom:16px;">
          <div style="font-size:48px;margin-bottom:12px;">🖥️</div>
          <h2 style="font-size:22px;font-weight:900;">Your PC Build</h2>
          <p style="color:var(--text-secondary);font-size:13px;">${Object.keys(selections).length} components selected</p>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">${parts}</div>
        <div class="glass" style="padding:20px;margin-top:16px;text-align:center;">
          <div style="font-size:28px;font-weight:900;color:var(--primary);">$${total.toFixed(0)}</div>
          <div style="font-size:13px;color:var(--text-secondary);">Estimated Total Cost</div>
        </div>
        <div style="text-align:center;margin-top:20px;">
          <a href="/" class="btn btn-primary">← Back to Home</a>
        </div>`;
    }
  </script>
</body>
