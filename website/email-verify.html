<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-posta Doğrulama — Qor AI</title>
  <meta name="description" content="Qor AI hesabınızın e-posta adresini doğrulayın.">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <script>try{var t=localStorage.getItem('qorai-theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <style>
    .reset-wrap {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .reset-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 20px 60px var(--shadow);
      text-align: center;
    }
    .reset-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
    }
    .reset-logo img { width: 32px; height: 32px; border-radius: 8px; }
    .reset-logo span { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: var(--text); }
    .verify-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: #fff;
    }
    .verify-icon.success { background: linear-gradient(135deg, #10b981, #059669); }
    .verify-icon.error { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .reset-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 10px;
    }
    .reset-subtitle {
      font-size: 14px;
      color: var(--text2);
      margin-bottom: 22px;
      line-height: 1.55;
    }
    .reset-msg {
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
      display: none;
      text-align: left;
    }
    .reset-msg.error {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5;
      display: block;
    }
    .reset-msg.success {
      background: rgba(16,185,129,.12);
      border: 1px solid rgba(16,185,129,.3);
      color: #6ee7b7;
      display: block;
    }
    .reset-btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .18s, transform .18s;
      margin-top: 8px;
    }
    .reset-btn:hover { opacity: .9; }
    .reset-back {
      display: block;
      text-align: center;
      color: var(--text3);
      font-size: 13px;
      margin-top: 22px;
      text-decoration: none;
    }
    .reset-back:hover { color: var(--accent); }
    .reset-spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99,102,241,.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 8px auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header class="site-header">
  <a href="/" class="logo-link">
    <img src="/assets/logo.png" alt="Qor AI" class="logo-img">
    <span class="logo-text">Qor AI</span>
  </a>
  <div class="header-actions">
    <button class="icon-btn theme-btn" id="theme-toggle" aria-label="Tema değiştir" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<main class="reset-wrap">
  <div class="reset-card">
    <div class="reset-logo">
      <img src="/assets/logo.png" alt="Qor AI">
      <span>Qor AI</span>
    </div>

    <div class="verify-icon" id="verifyIcon">✉️</div>
    <h1 class="reset-title" id="pageTitle">E-posta Doğrulanıyor…</h1>
    <p class="reset-subtitle" id="pageSubtitle">Lütfen bekleyin, hesabınız doğrulanıyor.</p>

    <div id="spinner" class="reset-spinner"></div>
    <div class="reset-msg" id="msgBox"></div>

    <a class="reset-back" href="/">← Qor AI ana sayfaya dön</a>
  </div>
</main>

<script>
  const PB_URL = 'https://yv5z6sfeiogrv3jn4djss832.46.225.95.201.sslip.io';

  function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('qorai-theme', next); } catch (e) {}
  }

  function getQuery(name) {
    var match = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : '';
  }

  function showMsg(text, kind) {
    var el = document.getElementById('msgBox');
    el.textContent = text;
    el.className = 'reset-msg ' + (kind || 'error');
  }

  function setIcon(state) {
    var el = document.getElementById('verifyIcon');
    el.className = 'verify-icon ' + (state || '');
    if (state === 'success') el.textContent = '✓';
    else if (state === 'error') el.textContent = '!';
    else el.textContent = '✉️';
  }

  function setState(title, subtitle) {
    document.getElementById('pageTitle').textContent = title;
    document.getElementById('pageSubtitle').textContent = subtitle;
  }

  document.addEventListener('DOMContentLoaded', function () {
    var TOKEN = getQuery('token');
    var spinner = document.getElementById('spinner');

    if (!TOKEN) {
      spinner.style.display = 'none';
      setIcon('error');
      setState('Geçersiz Bağlantı', 'Bu doğrulama bağlantısı geçersiz veya eksik.');
      showMsg('Lütfen Qor AI uygulamasından yeni bir doğrulama maili gönderin.', 'error');
      return;
    }

    fetch(PB_URL + '/api/collections/users/confirm-verification', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN }),
    })
      .then(function (res) {
        return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; })
          .catch(function () { return { ok: res.ok, status: res.status, body: {} }; });
      })
      .then(function (result) {
        spinner.style.display = 'none';
        if (result.ok || result.status === 204) {
          setIcon('success');
          setState('E-posta Doğrulandı', 'Hesabınız başarıyla doğrulandı. Qor AI uygulamasına dönüp tüm AI özelliklerini kullanmaya başlayabilirsiniz.');
          showMsg('Doğrulama tamamlandı. Uygulamada "Doğrulamayı kontrol et" butonuna basabilirsiniz.', 'success');
          // Try to deep-link back to app (optional)
          setTimeout(function () {
            try { window.location.href = 'qorai://email-verified'; } catch (e) {}
          }, 800);
        } else {
          setIcon('error');
          var msg = (result.body && (result.body.message || result.body.error)) || '';
          // PB returns 400 with "Failed to authenticate." if token already used / expired
          var alreadyVerified = /already|verified|invalid token|failed/i.test(msg);
          if (alreadyVerified) {
            setIcon('success');
            setState('Zaten Doğrulanmış', 'Bu e-posta adresi zaten doğrulanmış. Qor AI uygulamasına dönebilirsiniz.');
            showMsg('Hesabınız aktif. Uygulamadan giriş yapabilirsiniz.', 'success');
          } else {
            setState('Doğrulama Başarısız', 'Bağlantı geçersiz veya süresi dolmuş olabilir.');
            showMsg(msg || 'Lütfen Qor AI uygulamasından yeni bir doğrulama maili gönderin.', 'error');
          }
        }
      })
      .catch(function () {
        spinner.style.display = 'none';
        setIcon('error');
        setState('Ağ Hatası', 'Sunucuya ulaşılamadı. Lütfen tekrar deneyin.');
        showMsg('İnternet bağlantınızı kontrol edip sayfayı yenileyin.', 'error');
      });
  });
</script>

</body>
</html>
