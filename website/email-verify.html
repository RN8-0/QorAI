    .verify-wrap {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .verify-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 40px 34px 32px;
      box-shadow: 0 24px 70px var(--shadow);
      text-align: center;
    }
    .verify-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 26px;
    }
    .verify-logo img { width: 36px; height: 36px; border-radius: 9px; }
    .verify-logo span { font-size: 19px; font-weight: 800; letter-spacing: 0; color: var(--text); }
    .verify-icon-wrap {
      width: 92px;
      height: 92px;
      border-radius: 24px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      box-shadow: 0 14px 36px rgba(59,130,246,.35);
      transition: background .35s ease, box-shadow .35s ease, transform .35s ease;
    }
    .verify-icon-wrap.success {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 14px 36px rgba(16,185,129,.4);
      transform: scale(1.04);
    }
    .verify-icon-wrap.error {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      box-shadow: 0 14px 36px rgba(239,68,68,.35);
    }
    .verify-icon-wrap svg { width: 46px; height: 46px; color: #fff; }
    .verify-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0;
      color: var(--text);
      margin-bottom: 12px;
    }
    .verify-subtitle {
      font-size: 15px;
      color: var(--text2);
      margin-bottom: 26px;
      line-height: 1.6;
    }
    .verify-msg {
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13.5px;
      line-height: 1.55;
      margin: 6px 0 18px;
      display: none;
      text-align: left;
    }
    .verify-msg.error {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5;
      display: block;
    }
    .verify-msg.success {
      background: rgba(16,185,129,.12);
      border: 1px solid rgba(16,185,129,.3);
      color: #6ee7b7;
      display: block;
    }
    .verify-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .18s, transform .18s;
      margin-top: 4px;
    }
    .verify-btn:hover { opacity: .92; transform: translateY(-1px); }
    .verify-btn:active { transform: translateY(0); }
    .verify-back {
      display: block;
      text-align: center;
      color: var(--text3);
      font-size: 13px;
      margin-top: 22px;
      text-decoration: none;
    }
    .verify-back:hover { color: var(--accent); }
    .verify-spinner {
      display: inline-block;
      width: 38px;
      height: 38px;
      border: 3px solid rgba(99,102,241,.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 4px auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop {
      0% { transform: scale(.6); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }
    .verify-icon-wrap.animated { animation: pop .45s cubic-bezier(.25,.9,.3,1.2); }

  const RTL_LANGS = ['ar', 'fa', 'he', 'ur'];

  function detectLang() {
    // Default to English unless explicit ?lang= override is provided in URL.
    // The verification email is generated server-side so the most reliable
    // signal is the query string set by the backend / app.
    var fromQuery = (location.search.match(/[?&]lang=([a-zA-Z-]+)/) || [])[1];
    if (fromQuery) {
      var two = fromQuery.toLowerCase().split(/[-_]/)[0];
      if (STRINGS[two]) return two;
    }
    return 'en';
  }

  const LANG = detectLang();
  const T = STRINGS[LANG] || STRINGS.en;
  document.documentElement.setAttribute('lang', LANG);
  if (RTL_LANGS.indexOf(LANG) !== -1) document.documentElement.setAttribute('dir', 'rtl');
  document.title = T.verifying + ' — Qor AI';
  document.getElementById('theme-toggle').setAttribute('aria-label', T.themeAria);
  document.getElementById('homeBack').textContent = T.backHome;
  document.getElementById('openAppLabel').textContent = T.openApp;

  function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('qorai-theme', next); } catch (e) {}
  }

  function getQuery(name) {
    var match = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : '';
  }

  function setIcon(state) {
    var wrap = document.getElementById('iconWrap');
    var svg = document.getElementById('iconSvg');
    wrap.classList.remove('success', 'error', 'animated');
    void wrap.offsetWidth;
    wrap.classList.add('animated');
    if (state === 'success') {
      wrap.classList.add('success');
      svg.innerHTML = '<polyline points="4,12 10,18 20,7"/>';
    } else if (state === 'error') {
      wrap.classList.add('error');
      svg.innerHTML = '<line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/>';
    } else {
      svg.innerHTML = '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>';
    }
  }

  function setState(title, subtitle) {
    document.getElementById('pageTitle').textContent = title;
    document.getElementById('pageSubtitle').textContent = subtitle;
    document.title = title + ' — Qor AI';
  }

  function showMsg(text, kind) {
    var el = document.getElementById('msgBox');
    el.textContent = text;
    el.className = 'verify-msg ' + (kind || 'error');
  }

  function showOpenApp() {
    document.getElementById('openAppBtn').style.display = 'inline-flex';
  }

  document.addEventListener('DOMContentLoaded', function () {
    setState(T.verifying, T.verifyingSub);
    var TOKEN = getQuery('token');
    var spinner = document.getElementById('spinner');

    if (!TOKEN) {
      spinner.style.display = 'none';
      setIcon('error');
      setState(T.invalid, T.invalidSub);
      showMsg(T.invalidMsg, 'error');
      return;
    }

    fetch(PB_URL + '/api/collections/users/confirm-verification', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN }),
    })
      .then(function (res) {
        return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; })
          .catch(function () { return { ok: res.ok, status: res.status, body: {} }; });
      })
      .then(function (result) {
        spinner.style.display = 'none';
        if (result.ok || result.status === 204) {
          setIcon('success');
          setState(T.success, T.successSub);
          showMsg(T.successMsg, 'success');
          showOpenApp();
          setTimeout(function () {
            try { window.location.href = 'qorai://email-verified'; } catch (e) {}
          }, 1200);
          return;
        }
        var msg = (result.body && (result.body.message || result.body.error)) || '';
        var alreadyVerified = /already|verified|invalid token|failed to authenticate/i.test(msg);
        if (alreadyVerified) {
          setIcon('success');
          setState(T.already, T.alreadySub);
          showMsg(T.alreadyMsg, 'success');
          showOpenApp();
        } else {
          setIcon('error');
          setState(T.expired, T.expiredSub);
          showMsg(msg || T.expiredMsg, 'error');
        }
      })
      .catch(function () {
        spinner.style.display = 'none';
        setIcon('error');
        setState(T.network, T.networkSub);
        showMsg(T.networkMsg, 'error');
      });
  });
</script>

</body>
</html>
