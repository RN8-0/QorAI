<style>
  .nav-link {
    padding: 7px 12px; font-size: 14px; font-weight: 600;
    color: var(--text2); border-radius: 8px; transition: color .15s, background .15s;
  }
  .nav-link:hover { color: var(--text); background: var(--bg3); }
  .nav-link.active { color: #001018; background: var(--brand-grad); }
  @media (max-width: 880px) { .header-nav { display: none !important; } }

  /* ─── Catalog page ─── */
  .cat-hero {
    padding: 36px 20px 18px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .cat-hero h1 {
    font-size: clamp(26px, 4vw, 38px); font-weight: 800; letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .cat-hero p { color: var(--text2); font-size: 15px; }
  .cat-search-wrap {
    max-width: 640px; margin: 22px auto 0;
    position: relative;
  }
  .cat-search-wrap svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text3); }
  .cat-search-wrap input {
    width: 100%;
    padding: 14px 18px 14px 46px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .cat-search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent3);
  }

  .cat-pills {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding: 16px 20px;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky; top: 60px; z-index: 90;
    backdrop-filter: blur(10px);
  }
  .cat-pills::-webkit-scrollbar { display: none; }
  .cat-pill {
    flex-shrink: 0;
    padding: 9px 16px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text2);
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
  }
  .cat-pill:hover { background: var(--bg3); color: var(--text); }
  .cat-pill.active {
    background: var(--brand-grad); color: #001018;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(0,229,255,.25);
  }

  .cat-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 18px 20px 8px;
  }
  .cat-toolbar .count { font-size: 13px; color: var(--text2); font-weight: 600; }
  .cat-sort {
    display: flex; gap: 6px;
    background: var(--bg2); padding: 4px;
    border-radius: 11px; border: 1px solid var(--border);
  }
  .cat-sort button {
    padding: 7px 12px;
    background: transparent; border: 0;
    color: var(--text2);
    font-size: 12px; font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .cat-sort button:hover { color: var(--text); background: var(--bg3); }
  .cat-sort button.active {
    background: var(--brand-grad); color: #001018;
  }

  .cat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
    padding: 14px 20px 60px;
  }

  .cat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: transform .18s ease, border-color .18s ease, box-shadow .2s ease;
    cursor: pointer;
  }
  .cat-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: var(--shadow-glow);
  }
  .cat-card .img {
    aspect-ratio: 1 / 1;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  [data-theme="dark"] .cat-card .img { background: #f4f5f7; }
  .cat-card .img img { width: 92%; height: 92%; object-fit: contain; }
  .cat-card .badge-cat {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,0.55); color: #fff;
    padding: 4px 9px; border-radius: 7px;
    font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    backdrop-filter: blur(4px);
  }
  .cat-card .body {
    padding: 14px;
    display: flex; flex-direction: column; gap: 8px; flex: 1;
  }
  .cat-card .brand { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .cat-card h3 {
    font-size: 14px; font-weight: 700; color: var(--text);
    line-height: 1.35;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    min-height: 38px;
  }
  .cat-card .meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: auto;
    padding-top: 6px;
  }
  .cat-card .price { font-size: 15px; font-weight: 800; color: var(--accent); }
  .cat-card .price.empty { color: var(--text3); font-weight: 600; font-size: 12px; }
  .cat-card .score-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px; font-weight: 800;
    background: rgba(34,197,94,.14); color: #22c55e;
  }
  .cat-card .score-chip.mid { background: rgba(245,158,11,.14); color: #f59e0b; }
  .cat-card .score-chip.low { background: rgba(239,68,68,.14); color: #ef4444; }
  .cat-card .score-chip.na { background: var(--bg3); color: var(--text3); }
  .cat-card .actions { display: flex; gap: 8px; padding: 0 14px 14px; }
  .cat-card .btn-cmp {
    flex: 1;
    padding: 9px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    font-size: 12px; font-weight: 700;
    cursor: pointer;
    transition: all .15s;
  }
  .cat-card .btn-cmp:hover { background: var(--accent3); border-color: var(--accent); color: var(--accent); }
  .cat-card .btn-cmp.active { background: var(--brand-grad); color: #001018; border-color: transparent; }

  .cat-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--text2);
  }
  .cat-empty .icon { font-size: 56px; margin-bottom: 12px; opacity: .5; }
  .cat-empty h3 { font-size: 19px; color: var(--text); margin-bottom: 8px; }
  .cat-empty p { font-size: 14px; max-width: 360px; margin: 0 auto; }

  .load-more {
    grid-column: 1 / -1;
    text-align: center;
    padding: 20px;
  }
  .load-more button {
    padding: 12px 28px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text); font-weight: 700; font-size: 14px;
    cursor: pointer;
    transition: all .15s;
  }
  .load-more button:hover { background: var(--bg3); border-color: var(--accent); color: var(--accent); }

  /* Skeleton */
  .skeleton-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
  }

  @media (max-width: 480px) {
    .cat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 12px 40px; }
    .cat-card .body { padding: 10px; gap: 6px; }
    .cat-card h3 { font-size: 12px; min-height: 32px; }
    .cat-card .price { font-size: 13px; }
  }
</style>

<script>
  function toggleTheme() {
    var c = document.documentElement.getAttribute('data-theme') || 'dark';
    var n = c === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n);
    try { localStorage.setItem('qorai-theme', n); } catch(e) {}
    document.getElementById('theme-toggle').textContent = n === 'dark' ? '🌙' : '☀️';
  }
  document.getElementById('theme-toggle').textContent =
    (document.documentElement.getAttribute('data-theme') === 'light') ? '☀️' : '🌙';

  /* ── Catalog logic ── */
  const PLACEHOLDER = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='1.5'%3E%3Crect x='2' y='2' width='20' height='20' rx='3'/%3E%3Ccircle cx='8.5' cy='8.5' r='1.5'/%3E%3Cpolyline points='21 15 16 10 5 21'/%3E%3C/svg%3E`;

  let allProducts = [];
  let viewProducts = [];
  let pageSize = 24;
  let displayed = 0;
  let activeCat = 'all';
  let activeSort = 'score';
  let searchQ = '';
  let compareList = JSON.parse(localStorage.getItem('qor-compare') || '[]');

  function fmtPrice(p) {
    const v = Number(p);
    if (!v || v <= 0) return null;
    if (v > 100000) return `₺${Math.round(v).toLocaleString('en-US')}`;
    if (v > 1000)   return `₺${Math.round(v).toLocaleString('en-US')}`;
    return `₺${v.toFixed(2)}`;
  }
  function scoreClass(s) {
    if (s == null || s <= 0) return 'na';
    if (s >= 75) return '';
    if (s >= 55) return 'mid';
    return 'low';
  }
  function scoreLabel(s) {
    if (s == null || s <= 0) return 'N/A';
    return Math.round(s);
  }
  function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function buildPills() {
    const counts = {};
    allProducts.forEach(p => {
      const c = (p.category || 'other').toLowerCase();
      counts[c] = (counts[c] || 0) + 1;
    });
    // Sort categories by count desc
    const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
    const $pills = document.getElementById('cat-pills');
    $pills.innerHTML = `<button class="cat-pill active" data-cat="all">All <span style="opacity:.6">(${allProducts.length})</span></button>`;
    sorted.forEach(([cat, n]) => {
      const label = cat.charAt(0).toUpperCase() + cat.slice(1).replace(/_/g, ' ');
      $pills.insertAdjacentHTML('beforeend', `<button class="cat-pill" data-cat="${escapeHtml(cat)}">${escapeHtml(label)} <span style="opacity:.55">${n}</span></button>`);
    });
    $pills.querySelectorAll('.cat-pill').forEach(b => {
      b.addEventListener('click', () => {
        activeCat = b.dataset.cat;
        $pills.querySelectorAll('.cat-pill').forEach(p => p.classList.toggle('active', p === b));
        applyFilters();
        if (typeof gtag === 'function') gtag('event', 'catalog_filter_category', { category: activeCat });
      });
    });
  }

  function applyFilters() {
    let v = allProducts;
    if (activeCat !== 'all') {
      v = v.filter(p => (p.category || '').toLowerCase() === activeCat);
    }
    if (searchQ) {
      const q = searchQ.toLowerCase();
      v = v.filter(p =>
        (p.name||'').toLowerCase().includes(q) ||
        (p.brand||'').toLowerCase().includes(q) ||
        (p.category||'').toLowerCase().includes(q)
      );
    }
    // Sort
    if (activeSort === 'score') v.sort((a,b) => (b.techScore||0) - (a.techScore||0));
    else if (activeSort === 'name') v.sort((a,b) => (a.name||'').localeCompare(b.name||''));
    else if (activeSort === 'price-asc') v.sort((a,b) => (a.price||Infinity) - (b.price||Infinity));
    else if (activeSort === 'price-desc') v.sort((a,b) => (b.price||0) - (a.price||0));

    viewProducts = v;
    displayed = pageSize;
    render();
  }

  function setSort(s) {
    activeSort = s;
    document.querySelectorAll('.cat-sort button').forEach(b => b.classList.toggle('active', b.dataset.sort === s));
    applyFilters();
    if (typeof gtag === 'function') gtag('event', 'catalog_sort', { sort: s });
  }
  window.setSort = setSort;

  function render() {
    const $g = document.getElementById('cat-grid');
    const $c = document.getElementById('cat-count');
    $c.textContent = `${viewProducts.length.toLocaleString('en-US')} products`;
    if (!viewProducts.length) {
      $g.innerHTML = `<div class="cat-empty">
        <div class="icon">🔎</div>
        <h3>No products found</h3>
        <p>Try a different search term or pick another category.</p>
      </div>`;
      return;
    }
    const slice = viewProducts.slice(0, displayed);
    $g.innerHTML = slice.map(p => {
      const img = p.imageUrl || PLACEHOLDER;
      const cat = (p.category || '').toLowerCase();
      const score = Number(p.techScore);
      const showScore = score > 0 && score < 100;
      const price = fmtPrice(p.price);
      const inCompare = compareList.includes(p.id);
      return `
        <article class="cat-card" data-id="${p.id}" onclick="openDetail('${p.id}')">
          <div class="img">
            ${cat ? `<span class="badge-cat">${escapeHtml(cat)}</span>` : ''}
            <img src="${escapeHtml(img)}" alt="${escapeHtml(p.name||'')}" loading="lazy" onerror="this.src='${PLACEHOLDER}'">
          </div>
          <div class="body">
            ${p.brand ? `<div class="brand">${escapeHtml(p.brand)}</div>` : ''}
            <h3>${escapeHtml(p.name||'Unnamed')}</h3>
            <div class="meta">
              ${price ? `<span class="price">${price}</span>` : `<span class="price empty">No price</span>`}
              <span class="score-chip ${scoreClass(score)}">${showScore ? '★ ' + scoreLabel(score) : 'N/A'}</span>
            </div>
          </div>
          <div class="actions">
            <button class="btn-cmp ${inCompare?'active':''}" onclick="event.stopPropagation();toggleCompare('${p.id}', this)">
              ${inCompare ? '✓ In compare' : '+ Compare'}
            </button>
          </div>
        </article>`;
    }).join('') + (viewProducts.length > displayed
      ? `<div class="load-more"><button onclick="loadMore()">Show more (${(viewProducts.length - displayed).toLocaleString('en-US')} left)</button></div>`
      : '');
  }
  window.loadMore = function() { displayed += pageSize; render(); };

  window.openDetail = function(id) {
    // For now: jump to compare with this product preselected
    const u = new URL('/compare.html', location.href);
    u.searchParams.set('add', id);
    location.href = u.toString();
  };

  window.toggleCompare = function(id, btn) {
    const i = compareList.indexOf(id);
    if (i >= 0) compareList.splice(i, 1);
    else if (compareList.length < 4) compareList.push(id);
    else { alert('You can compare up to 4 products at once.'); return; }
    localStorage.setItem('qor-compare', JSON.stringify(compareList));
    const badge = document.getElementById('compare-badge');
    if (badge) {
      badge.textContent = compareList.length;
      badge.style.display = compareList.length ? 'inline-flex' : 'none';
    }
    if (btn) {
      const active = compareList.includes(id);
      btn.classList.toggle('active', active);
      btn.textContent = active ? '✓ In compare' : '+ Compare';
    }
    if (typeof gtag === 'function') gtag('event', 'catalog_toggle_compare', { id });
  };

  // Search debounce
  document.getElementById('cat-search').addEventListener('input', e => {
    clearTimeout(window._catSrchT);
    window._catSrchT = setTimeout(() => {
      searchQ = e.target.value.trim();
      applyFilters();
      if (typeof gtag === 'function' && searchQ) gtag('event', 'catalog_search', { query: searchQ });
    }, 220);
  });

  // Init compare badge from storage
  (function() {
    const badge = document.getElementById('compare-badge');
    if (badge && compareList.length) {
      badge.textContent = compareList.length;
      badge.style.display = 'inline-flex';
    }
  })();

  // Load
  (async () => {
    try {
      allProducts = await pbLoadProducts(500);
      // Strip products without name/image
      allProducts = allProducts.filter(p => p.name);
      buildPills();
      applyFilters();
    } catch (e) {
      console.error(e);
      document.getElementById('cat-grid').innerHTML = `<div class="cat-empty">
        <div class="icon">⚠️</div>
        <h3>Could not load products</h3>
        <p>Please refresh the page or check your connection.</p>
      </div>`;
      document.getElementById('cat-count').textContent = 'Error';
    }
  })();
</script>

</body>
</html>
