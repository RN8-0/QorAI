<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compair — Ürün Karşılaştırma</title>
  <meta name="description" content="Teknoloji ürünlerini yapay zeka destekli analizle karşılaştırın. En iyi akıllı telefonları, dizüstü bilgisayarları, GPU'ları ve daha fazlasını bulun.">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
  <script>try{var t=localStorage.getItem('compair-theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>

<!-- SITE HEADER -->
<header class="site-header">
  <a href="/" class="logo-link">
    <img src="/assets/logo.png" alt="Compair" class="logo-img">
    <span class="logo-text">Compair</span>
  </a>
  <div class="header-search">
    <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search-input" placeholder="Ürün, marka veya kategori ara..." autocomplete="off" spellcheck="false">
    <button class="search-clear" id="search-clear" style="display:none" aria-label="Aramayı temizle">✕</button>
  </div>
  <div class="header-actions">
    <button class="icon-btn theme-btn" id="theme-toggle" aria-label="Tema değiştir" onclick="toggleTheme()">🌙</button>
    <a href="/compare.html" class="icon-btn compare-link" title="Karşılaştır" aria-label="Karşılaştır">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="compare-badge" id="compare-badge" style="display:none">0</span>
    </a>
    <div id="auth-btn-container"></div>
  </div>
</header>

<!-- CATEGORY NAV -->
<nav class="cat-nav" id="cat-nav" aria-label="Kategori navigasyonu">
  <div class="cat-nav-inner">
    <button class="cat-tab active" data-cat="all">📦 Tümü</button>
    <button class="cat-tab" data-cat="smartphones">📱 Telefonlar</button>
    <button class="cat-tab" data-cat="laptops">💻 Laptoplar</button>
    <button class="cat-tab" data-cat="tablets">📟 Tabletler</button>
    <button class="cat-tab" data-cat="headphones">🎧 Kulaklık</button>
    <button class="cat-tab" data-cat="gpus">⚙️ GPU</button>
    <button class="cat-tab" data-cat="monitors">🖥️ Monitör</button>
    <button class="cat-tab" data-cat="tvs">📺 TV</button>
    <button class="cat-tab" data-cat="smartwatches">⌚ Akıllı Saat</button>
    <button class="cat-tab" data-cat="cameras">📷 Kamera</button>
    <button class="cat-tab" data-cat="speakers">🔊 Hoparlör</button>
    <button class="cat-tab" data-cat="keyboards">⌨️ Klavye</button>
    <button class="cat-tab" data-cat="mice">🖱️ Fare</button>
  </div>
</nav>

<!-- PAGE BODY -->
<div class="page-body">

  <!-- FILTER SIDEBAR -->
  <aside class="filters-sidebar" id="filters-sidebar" aria-label="Filtreler">
    <div class="filter-header">
      <span>Filtreler</span>
      <button class="filter-clear-btn" onclick="clearFilters()">Temizle</button>
    </div>

    <div class="filter-section">
      <h4 class="filter-title">Kategori</h4>
      <div class="filter-options" id="filter-categories"></div>
    </div>

    <div class="filter-section">
      <h4 class="filter-title">Fiyat Aralığı</h4>
      <label class="filter-label"><input type="checkbox" class="price-filter" value="budget"> Bütçe Dostu</label>
      <label class="filter-label"><input type="checkbox" class="price-filter" value="mid_range"> Orta Segment</label>
      <label class="filter-label"><input type="checkbox" class="price-filter" value="premium"> Premium</label>
    </div>

    <div class="filter-section">
      <h4 class="filter-title">Skor</h4>
      <label class="filter-label"><input type="checkbox" class="score-filter" value="80"> 80+ Mükemmel</label>
      <label class="filter-label"><input type="checkbox" class="score-filter" value="60"> 60–80 İyi</label>
      <label class="filter-label"><input type="checkbox" class="score-filter" value="0"> 60 Altı</label>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <div class="main-area">
    <button class="mobile-filter-btn" id="mobile-filter-btn" onclick="toggleMobileFilters()">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      Filtreler
    </button>

    <div class="sort-bar">
      <span class="product-count" id="product-count">Yükleniyor...</span>
      <div class="sort-options">
        <button class="sort-btn active" data-sort="score" onclick="sortBy('score')">⚡ Puana Göre</button>
        <button class="sort-btn" data-sort="price-asc" onclick="sortBy('price-asc')">₺↑ Ucuzdan</button>
        <button class="sort-btn" data-sort="price-desc" onclick="sortBy('price-desc')">₺↓ Pahalıdan</button>
        <button class="sort-btn" data-sort="name" onclick="sortBy('name')">A–Z İsme Göre</button>
      </div>
    </div>

    <div class="product-grid" id="product-grid">
      <div class="skeleton-card"><div class="skeleton" style="height:160px;border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div style="padding:12px;display:flex;flex-direction:column;gap:8px"><div class="skeleton" style="height:11px;width:60%;border-radius:99px"></div><div class="skeleton" style="height:14px;width:85%;border-radius:4px"></div><div class="skeleton" style="height:14px;width:70%;border-radius:4px"></div><div class="skeleton" style="height:18px;width:50%;border-radius:99px"></div><div class="skeleton" style="height:30px;border-radius:var(--radius-sm)"></div></div></div>

      <div class="skeleton-card"><div class="skeleton" style="height:160px;border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div style="padding:12px;display:flex;flex-direction:column;gap:8px"><div class="skeleton" style="height:11px;width:60%;border-radius:99px"></div><div class="skeleton" style="height:14px;width:85%;border-radius:4px"></div><div class="skeleton" style="height:14px;width:70%;border-radius:4px"></div><div class="skeleton" style="height:18px;width:50%;border-radius:99px"></div><div class="skeleton" style="height:30px;border-radius:var(--radius-sm)"></div></div></div>
      <div class="skeleton-card"><div class="skeleton" style="height:160px;border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div style="padding:12px;display:flex;flex-direction:column;gap:8px"><div class="skeleton" style="height:11px;width:60%;border-radius:99px"></div><div class="skeleton" style="height:14px;width:85%;border-radius:4px"></div><div class="skeleton" style="height:14px;width:70%;border-radius:4px"></div><div class="skeleton" style="height:18px;width:50%;border-radius:99px"></div><div class="skeleton" style="height:30px;border-radius:var(--radius-sm)"></div></div></div>

      <div class="skeleton-card"><div class="skeleton" style="height:160px;border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div style="padding:12px;display:flex;flex-direction:column;gap:8px"><div class="skeleton" style="height:11px;width:60%;border-radius:99px"></div><div class="skeleton" style="height:14px;width:85%;border-radius:4px"></div><div class="skeleton" style="height:14px;width:70%;border-radius:4px"></div><div class="skeleton" style="height:18px;width:50%;border-radius:99px"></div><div class="skeleton" style="height:30px;border-radius:var(--radius-sm)"></div></div></div>
      <div class="skeleton-card"><div class="skeleton" style="height:160px;border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div style="padding:12px;display:flex;flex-direction:column;gap:8px"><div class="skeleton" style="height:11px;width:60%;border-radius:99px"></div><div class="skeleton" style="height:14px;width:85%;border-radius:4px"></div><div class="skeleton" style="height:14px;width:70%;border-radius:4px"></div><div class="skeleton" style="height:18px;width:50%;border-radius:99px"></div><div class="skeleton" style="height:30px;border-radius:var(--radius-sm)"></div></div></div>
      <div class="skeleton-card"><div class="skeleton" style="height:160px;border-radius:var(--radius-sm) var(--radius-sm) 0 0"></div><div style="padding:12px;display:flex;flex-direction:column;gap:8px"><div class="skeleton" style="height:11px;width:60%;border-radius:99px"></div><div class="skeleton" style="height:14px;width:85%;border-radius:4px"></div><div class="skeleton" style="height:14px;width:70%;border-radius:4px"></div><div class="skeleton" style="height:18px;width:50%;border-radius:99px"></div><div class="skeleton" style="height:30px;border-radius:var(--radius-sm)"></div></div></div>
    </div>

    <div class="load-more-wrap">
      <button id="load-more" class="load-more-btn" onclick="loadMore()" style="display:none">Daha Fazla Göster</button>
    </div>
  </div>
</div>

<!-- PRODUCT DETAIL MODAL -->
<div class="product-modal-overlay" id="product-modal-overlay" onclick="closeModal()"></div>
<div class="product-modal" id="product-modal" role="dialog" aria-modal="true" aria-label="Ürün Detayı">
  <button class="modal-close" onclick="closeModal()" aria-label="Kapat">✕</button>
  <div id="modal-content"></div>
</div>

<!-- MOBILE FILTER DRAWER OVERLAY -->
<div class="filter-drawer-overlay" id="filter-drawer-overlay" onclick="toggleMobileFilters()"></div>
