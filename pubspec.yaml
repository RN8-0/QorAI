name: compair
description: "Compair - AI Product Advisor. Your personal decision engine."
publish_to: 'none'
version: 2.0.2+8

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_remote_config: ^5.5.0
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.5
  firebase_performance: ^0.10.1+5
  firebase_messaging: ^15.2.4
  cloud_functions: ^5.3.3

  # AI & Networking
  dio: ^5.7.0
  retrofit: ^4.4.1

  # Search
  algolia_helper_flutter: ^1.1.0

  # Local Cache
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  shared_preferences: ^2.3.3

  # Subscriptions
  in_app_purchase: ^3.2.0

  # UI & Animations
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  animated_text_kit: ^4.2.2
  glassmorphism: ^3.0.0
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.20.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  equatable: ^2.0.7
  uuid: ^4.5.1
  crypto: ^3.0.6
  connectivity_plus: ^6.1.2
  package_info_plus: ^8.1.3
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  flutter_svg: ^2.0.17
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  app_tracking_transparency: ^2.0.6
  speech_to_text: ^7.3.0
  youtube_player_iframe: ^5.2.2
  youtube_explode_dart: ^3.0.5
  chewie: ^1.13.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  freezed: ^2.5.7
  riverpod_generator: ^2.6.3
  retrofit_generator: ^9.1.7
  mockito: ^5.4.5
  flutter_launcher_icons: ^0.14.4

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/logo/
    - assets/lottie/
    - assets/icons/
    - assets/en_tr_specs.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/compair_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo/compair_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo/compair_logo.png"
    background_color: "#000000"
    theme_color: "#000000"
