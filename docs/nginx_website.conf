# ─────────────────────────────────────────────────────────────────────────────
# BU DOSYA DAGITILMAZ. Canli yapilandirma Coolify veritabaninda,
# `applications.custom_nginx_configuration` kolonunda ve BASE64 tutulur
# (uygulama uuid `z12jcqfpvl0m7l3nv9t6l5jl`). Build pack `static` oldugu icin
# repodaki hicbir nginx dosyasi kullanilmaz -- burasi yalnizca okunabilir
# kopya ve degisiklik gerekcelerinin yazildigi yer.
#
# Degistirme sirasi (2026-08-30'da bu sirayla uygulandi):
#   1) DB'den oku, base64 coz
#   2) duzenle, SOZDIZIMINI TEST ET:
#      docker run --rm -v /tmp/aday.conf:/etc/nginx/conf.d/default.conf:ro #        nginx:alpine nginx -t
#   3) base64 -w0 ile kodla, psql ile UPDATE (REST API PATCH KULLANMA --
#      veriyi bir kez daha sarar ve site 503 olur)
#   4) deploy_coolify_static.js website
#   5) canli dogrula (301/200 bekle)
# Ayrinti: memory reference-coolify-nginx-base64
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS'i Traefik sonlandiriyor; nginx icin $scheme=http. absolute_redirect
    # acikken 301'ler "http://qorai.net/..." uretiyor ve tarayici fazladan bir
    # http->https hop'u yapiyordu (olculdu). Kapatinca Location goreli olur ve
    # mevcut sema (https) korunur.
    absolute_redirect off;

    location /spa/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /assets/ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

    # /en/... artik URETILMIYOR: Ingilizce KOK adreste (2026-08-05). Eskiden
    # indekslenmis /en/ adresleri ana sayfa klonu donmesin diye kok karsiligina
    # kalici yonlendirilir; birikmis deger kok adrese tasinir.
    location = /en { return 301 /; }
    location ^~ /en/ { rewrite ^/en/(.*)$ /$1 permanent; }

    # ALMANCA KALDIRILDI (2026-08-21): /de/ artik uretilmiyor. Indekste duran
    # ~7.700 /de/ adresi 404'e dusup deger kaybetmesin diye kok (Ingilizce)
    # karsiligina KALICI yonlendirilir — /en/ ile ayni kalip.
    location = /de { return 301 /; }
    location ^~ /de/ { rewrite ^/de/(.*)$ /$1 permanent; }

    # BLOGDA DIL ONEKI YOKTUR (2026-08-29). Blog i18n'i onek degil SLUG
    # tabanli (slug_tr / slug_en), bu yuzden seo.mjs yazilari YALNIZ
    # /blog/<slug> altina on-render ediyor. SPA `/tr` altinda
    # basename="/tr" tasidigi icin ic linkler bir donem /tr/blog/<slug>
    # uretti; o adreste on-render dosyasi olmadigindan try_files 404
    # kabuguna dusuyor ve YUMUSAK 404 doniyordu -- HTTP 200 + "noindex".
    # Olculdu 2026-08-29 (GSC "URL Google'da yok", tarama 25 Agu):
    #   /tr/blog/okula-donus-2026-en-iyi-ogrenci-laptoplari -> 200, noindex
    # Sitenin tek uzun-form ozgun icerigi boylece indeks disi kaliyordu.
    # DIKKAT: /tr/blog (LISTE) gercek bir on-render sayfadir ve sitemap'te
    # durur; asagidaki regex sonunda `/` + en az bir karakter arar, liste
    # adresine DOKUNMAZ.
    location ~ "^/tr/blog/(?<byazi>.+)$" { return 301 /blog/$byazi; }

    # ON-RENDER EDILMEMIS her adres (ornegin curated olmayan ~100k urun, ya da
    # /tr/product/... gibi uretilmeyen dil yollari) eskiden ANA SAYFA kabugunu
    # donuyor, canonical'i ANA SAYFAYI gosteriyor ve "index, follow" tasiyordu
    # -> Google icin binlerce ana sayfa KOPYASI (olculdu 2026-08-05).
    # Artik noindex 404 kabugu donuyor: SPA ayni bundle ile aciliyor, sayfa
    # calisir kalir, yalnizca indekslenmez. Sitemap zaten sadece on-render
    # edilmis sayfalari listeliyor, dolayisiyla indekslenmesi gereken hicbir
    # adres etkilenmez.
    # --- urun adresi: sondaki id kaldirildi (2026-08-19) ---
    # /product/<slug>-<id>  ->  /product/<slug>   (kalici, dil onekleri dahil)
    # Once ISTENEN adres denenir: 462 urunun slug'i zaten 15 karakterlik id
    # kalibiyla bitiyor, onlarin YENI adresi de bu regex'e uyar.
    location ~ "^(?<qonek>/tr)?/product/(?<qyeni>.+)-[a-z0-9]{15}$" {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html @urun_id_kaldir;
    }
    # 301 YALNIZCA hedef varsa. Yoksa 404 kabugu doner ve SPA jetonu
    # kendisi cozer — yanlis urune yonlendirmektense yonlendirmemek dogru.
    location @urun_id_kaldir {
        add_header Cache-Control "no-cache";
        if (-d $document_root$qonek/product/$qyeni) { return 301 $qonek/product/$qyeni; }
        try_files /404.html =404;
    }
    # --- karsilastirma adresi: id'ler kaldirildi (2026-08-22) ---
    # /compare/<slugA>-<idA>-vs-<slugB>-<idB>  ->  /compare/<slugA>-vs-<slugB>
    # Urun adresiyle AYNI kalip: once ISTENEN adres denenir (bir slug zaten 15
    # karakterlik id kalibiyla bitiyor olabilir), bulunamazsa id'ler soyulur.
    # Desen IKI TARAFTA DA id arar — uretilen eski bicim tam olarak buydu.
    location ~ "^(?<konek>/tr)?/compare/(?<kya>.+)-[a-z0-9]{15}-vs-(?<kyb>.+)-[a-z0-9]{15}$" {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html @cmp_id_kaldir;
    }
    # 301 YALNIZCA hedef varsa; yoksa 404 kabugu doner ve SPA jetonu kendisi
    # cozer (parseComparePair iki bicimi de kabul ediyor). Var olmayan bir
    # adrese yonlendirmektense yonlendirmemek dogru.
    location @cmp_id_kaldir {
        add_header Cache-Control "no-cache";
        if (-d $document_root$konek/compare/$kya-vs-$kyb) { return 301 $konek/compare/$kya-vs-$kyb; }
        try_files /404.html =404;
    }
    # --- son ---

    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/index.html $uri/ /404.html; }
}
